[pytest]
# Pytest configuration

# Test discovery path
testpaths = test

# Python import path
pythonpath = .

# Test file and directory patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Do not import the repository root as a package
addopts = --import-mode=importlib

# Paths excluded from test discovery
norecursedirs = .git .venv __pycache__ *.egg-info build dist
